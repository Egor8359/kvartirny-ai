services:
  - type: web
    name: kvartirny-ai-preview
    runtime: python
    plan: free
    branch: deploy/preview-validation
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn index:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: preview
      - key: DB_SSL_MODE
        value: require
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ROUTERAI_API_KEY
        sync: false
